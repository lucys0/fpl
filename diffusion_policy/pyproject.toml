# uv environment for the simulation experiments, an alternative to
# conda_environment.yaml:  cd diffusion_policy && uv sync
#
# Versions follow conda_environment.yaml. Packages only needed by tasks the FPL
# pipelines don't use (kitchen, block pushing, real robot, R3M / video encoders,
# ray) are left out.
[project]
name = "diffusion_policy"
version = "0.0.0"
requires-python = "==3.9.*"
dependencies = [
    "torch==1.12.1",
    "torchvision==0.13.1",
    "pytorch3d",
    "numpy==1.23.3",
    "scipy==1.9.1",
    "opencv-python-headless==4.6.0.66",
    "matplotlib==3.6.1",
    "pandas",
    "zarr==2.12.0",
    "numcodecs==0.10.2",
    "h5py==3.7.0",
    "hydra-core==1.2.0",
    "einops==0.4.1",
    "tqdm==4.64.1",
    "dill==0.3.5.1",
    "scikit-video==1.1.11",
    "scikit-image==0.19.3",
    "gym==0.21.0",
    "pymunk==6.2.1",
    "pygame==2.1.2",
    "shapely==1.8.4",
    "threadpoolctl==3.1.0",
    # mujoco-py compiles itself on first import and breaks with Cython 3
    "cython==0.29.32",
    "imageio==2.22.0",
    "imageio-ffmpeg==0.4.7",
    "imagecodecs==2022.9.26",
    # rollout videos; the conda pin (10.0.0) has no Python 3.9 wheel to install
    "av==12.3.0",
    "termcolor==2.0.1",
    "tensorboard==2.10.1",
    "tensorboardx==2.5.1",
    "psutil==5.9.2",
    "click==8.0.4",
    "huggingface-hub==0.11.1",
    "diffusers==0.11.1",
    # the conda pin (0.13.3) predates the new wandb_v1_ API key format
    "wandb>=0.22",
    # gym, tensorboard and mujoco-py still import pkg_resources
    "setuptools<70",
    "free-mujoco-py==2.1.6",
    "robosuite @ https://github.com/cheng-chi/robosuite/archive/277ab9588ad7a4f4b55cf75508b44aa67ec171f0.tar.gz",
    "robomimic==0.2.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# torch 1.12's build helpers (used by pytorch3d's setup.py) import pkg_resources,
# which setuptools 70+ no longer ships
build-constraint-dependencies = ["setuptools<70"]

[tool.uv.sources]
torch = { index = "pytorch-cu116" }
torchvision = { index = "pytorch-cu116" }
pytorch3d = { git = "https://github.com/facebookresearch/pytorch3d.git", tag = "v0.7.4" }
# gym 0.21.0 from PyPI has an unparseable extra ("opencv-python>=3.") that uv
# rejects; this wheel is the same sdist built with that one string fixed
gym = { path = "third_party/gym-0.21.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cu116"
url = "https://download.pytorch.org/whl/cu116"
explicit = true

# Only pytorch3d.transforms (pure Python) is used, so skip compiling its
# C++/CUDA ops. Its setup.py still imports torch, hence the build dependency.
[tool.uv.extra-build-dependencies]
pytorch3d = [{ requirement = "torch", match-runtime = true }]

[tool.uv.extra-build-variables]
pytorch3d = { PYTORCH3D_NO_EXTENSION = "1" }

[[tool.uv.dependency-metadata]]
name = "pytorch3d"
version = "0.7.4"
requires-dist = ["fvcore", "iopath"]
